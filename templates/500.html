<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — ScrumManager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0f14; color: #94a3b8; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; text-align: center; padding: 24px; }
    .code { font-size: 72px; font-weight: 700; color: #ef4444; line-height: 1; }
    .msg  { font-size: 18px; color: #e2e8f0; margin: 12px 0 8px; font-weight: 500; }
    .sub  { font-size: 14px; color: #64748b; margin-bottom: 28px; }
    a     { color: #6366f1; text-decoration: none; font-size: 14px;
            border: 1px solid #6366f1; padding: 8px 20px; border-radius: 8px; }
    a:hover { background: rgba(99,102,241,0.1); }
  </style>
</head>
<body>
  <div>
    <div class="code">500</div>
    <div class="msg">Something went wrong</div>
    <div class="sub">An internal server error occurred. We are looking into it.</div>
    <a href="/">Go home</a>
  </div>
</body>
</html>
