version: "3.9"

services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://scrumuser:scrumpass@db:5432/scrummanager
      - SECRET_KEY=dev-secret-key-change-this-later
      - FLASK_ENV=development
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=scrumuser
      - POSTGRES_PASSWORD=scrumpass
      - POSTGRES_DB=scrummanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: