services:
  - type: web
    name: scrummanager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m flask run --host=0.0.0.0 --port=$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scrummanager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app.py

databases:
  - name: scrummanager-db
    databaseName: scrummanager
    user: scrumuser